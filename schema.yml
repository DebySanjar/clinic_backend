openapi: 3.0.3
info:
  title: DentFlow API
  version: 1.0.0
  description: |-
    Stomatologiya klinikasi avtomatlashtirish tizimi uchun REST API.

    Shifokorlar, xizmatlar, bemorlar, qabullar va statistika bilan ishlash.
paths:
  /api/appointments/:
    get:
      operationId: appointments_list
      summary: Qabullar ro'yxati
      parameters:
      - in: query
        name: date
        schema:
          type: string
          format: date
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: doctor_id
        schema:
          type: integer
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: patient_id
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - cancelled
          - completed
          - confirmed
          - in_progress
          - no_show
          - pending
      tags:
      - Appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentListList'
          description: ''
    post:
      operationId: appointments_create
      summary: Yangi qabul yaratish
      tags:
      - Appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentCreate'
          description: ''
  /api/appointments/{id}/:
    get:
      operationId: appointments_retrieve
      summary: Qabul tafsilotlari
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Qabul.
        required: true
      tags:
      - Appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDetail'
          description: ''
    put:
      operationId: appointments_update
      summary: Qabulni yangilash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Qabul.
        required: true
      tags:
      - Appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppointmentListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AppointmentListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AppointmentListRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentList'
          description: ''
    patch:
      operationId: appointments_partial_update
      summary: Qabulni qisman yangilash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Qabul.
        required: true
      tags:
      - Appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentListRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentListRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointmentListRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentList'
          description: ''
    delete:
      operationId: appointments_destroy
      summary: Qabulni o'chirish
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Qabul.
        required: true
      tags:
      - Appointments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/appointments/{id}/cancel/:
    post:
      operationId: appointments_cancel_create
      description: Qabulni bekor qilish
      summary: Qabulni bekor qilish
      parameters:
      - in: path
