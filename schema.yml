          description: ''
  /api/appointments/{id}/confirm/:
    post:
      operationId: appointments_confirm_create
      description: Qabulni tasdiqlash
      summary: Qabulni tasdiqlash
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Qabul.
        required: true
      tags:
      - Appointments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentList'
